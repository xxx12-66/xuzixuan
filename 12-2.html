<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Grid 布局 - 徐梓轩</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f0f3f4;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 120px);
            gap: 10px;
        }

        .grid-item {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            color: #fff;
            border-radius: 8px;
        }

        .a {
            grid-column: 1;
            grid-row: 1;
            background: #3498db;
        }

        .b {
            grid-column: 2 / 4;
            grid-row: 1 / 3;
            background: #e74c3c;
        }

        .c {
            grid-column: 1;
            grid-row: 2 / 5;
            background: #2ecc71;
        }

        .d {
            grid-column: 2;
            grid-row: 3 / 5;
            background: #f39c12;
        }

        .e {
            grid-column: 3;
            grid-row: 3;
            background: #9b59b6;
        }

        .f {
            grid-column: 3;
            grid-row: 4;
            background: #1abc9c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Grid 布局演示 - 徐梓轩</h1>
        <div class="grid">
            <div class="grid-item a">A</div>
            <div class="grid-item b">B</div>
            <div class="grid-item c">C</div>
            <div class="grid-item d">D</div>
            <div class="grid-item e">E</div>
            <div class="grid-item f">F</div>
        </div>
    </div>
</body>
</html>
