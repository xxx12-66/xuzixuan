<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>徐梓轩 - Media Query 布局</title>
	<style>
		* {
			box-sizing: border-box;
		}

		html {
			min-width: 320px;
			font-family: sans-serif;
		}

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			padding: 32px 20px;
			background-color: #f4f6f2;
			color: #203a32;
		}

		main {
			width: min(100%, 1280px);
			margin: 0 auto;
		}

		h1 {
			margin: 0 0 24px;
			font-size: 2rem;
		}

		.boxes {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 16px;
		}

		.box {
			position: relative;
			overflow: hidden;
			min-height: 120px;
			display: flex;
			justify-content: center;
			align-items: center;
			border: 1px solid rgba(255, 255, 255, 0.55);
			border-radius: 18px;
			background: linear-gradient(135deg, var(--box-start), var(--box-end));
			box-shadow: 0 8px 18px rgba(32, 58, 50, 0.12);
			color: #fff;
			font-size: 1.5rem;
			font-weight: 600;
			text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
			animation: box-appear 600ms both;
			transition: transform 220ms ease, box-shadow 220ms ease;
		}

		.box::before {
			position: absolute;
			top: -45%;
			right: -20%;
			width: 110px;
			height: 110px;
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.2);
			content: "";
			transition: transform 300ms ease;
		}

		.box:hover {
			z-index: 1;
			transform: translateY(-8px) scale(1.04);
			box-shadow: 0 16px 28px rgba(32, 58, 50, 0.24);
		}

		.box:hover::before {
			transform: scale(1.5);
		}

		.box:nth-child(1) { --box-start: #ff9966; --box-end: #ff5e62; animation-delay: 0ms; }
		.box:nth-child(2) { --box-start: #f6d365; --box-end: #fda085; animation-delay: 70ms; }
		.box:nth-child(3) { --box-start: #84fab0; --box-end: #48b1bf; animation-delay: 140ms; }
		.box:nth-child(4) { --box-start: #5ee7df; --box-end: #3a7bd5; animation-delay: 210ms; }
		.box:nth-child(5) { --box-start: #a18cd1; --box-end: #fbc2eb; animation-delay: 280ms; }
		.box:nth-child(6) { --box-start: #f093fb; --box-end: #f5576c; animation-delay: 350ms; }
		.box:nth-child(7) { --box-start: #667eea; --box-end: #764ba2; animation-delay: 420ms; }
		.box:nth-child(8) { --box-start: #30cfd0; --box-end: #330867; animation-delay: 490ms; }

		@keyframes box-appear {
			from {
				opacity: 0;
				transform: translateY(18px) scale(0.96);
			}
			to {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.box {
				animation: none;
				transition: none;
			}

			.box::before {
				transition: none;
			}

			.box:hover {
				transform: none;
			}
		}

		@media (min-width: 600px) {
			.boxes {
				grid-template-columns: repeat(3, minmax(0, 1fr));
			}
		}

		@media (min-width: 900px) {
			.boxes {
				grid-template-columns: repeat(4, minmax(0, 1fr));
			}
		}

		@media (min-width: 1200px) {
			.boxes {
				grid-template-columns: repeat(8, minmax(0, 1fr));
			}
		}
	</style>
</head>
<body>
	<main>
		<h1>徐梓轩</h1>
		<section class="boxes" aria-label="响应式盒子布局">
			<div class="box">1</div>
			<div class="box">2</div>
			<div class="box">3</div>
			<div class="box">4</div>
			<div class="box">5</div>
			<div class="box">6</div>
			<div class="box">7</div>
			<div class="box">8</div>
		</section>
	</main>
</body>
</html>
