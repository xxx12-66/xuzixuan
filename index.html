<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1020 徐梓轩的《高级网页设计》课堂实践</title>
<style>
/* ==========================================================================
   主题变量
   ========================================================================== */
:root {
  --bg:            #0a0b12;
  --bg-soft:       #10121c;
  --card:          rgba(255, 255, 255, .045);
  --card-hover:    rgba(255, 255, 255, .085);
  --border:        rgba(255, 255, 255, .09);
  --border-strong: rgba(255, 255, 255, .18);
  --text:          #eef1f8;
  --text-2:        #a5aec6;
  --text-3:        #6b7690;
  --accent:        #7c6cff;
  --accent-2:      #35d6c8;
  --accent-3:      #ff77b7;
  --shadow:        0 18px 50px rgba(0, 0, 0, .45);
  --pill:          rgba(255, 255, 255, .06);
  --grid:          rgba(255, 255, 255, .035);
}
html[data-theme="light"] {
  --bg:            #f4f5fa;
  --bg-soft:       #ffffff;
  --card:          rgba(255, 255, 255, .78);
  --card-hover:    #ffffff;
  --border:        rgba(18, 22, 40, .09);
  --border-strong: rgba(18, 22, 40, .18);
  --text:          #131725;
  --text-2:        #4c5670;
  --text-3:        #8a93a8;
  --accent:        #5b4bdb;
  --accent-2:      #0fa89c;
  --accent-3:      #d94f92;
  --shadow:        0 14px 40px rgba(24, 32, 64, .12);
  --pill:          rgba(24, 32, 64, .05);
  --grid:          rgba(24, 32, 64, .05);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
  transition: background .35s ease, color .35s ease;
}

/* ==========================================================================
   背景装饰：极光光斑 + 网格
   ========================================================================== */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg::before {
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 75%);
}
.orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; }
.orb.o1 { width: 46vw; height: 46vw; left: -12vw; top: -14vw; background: #5b4bdb; }
.orb.o2 { width: 38vw; height: 38vw; right: -10vw; top: -6vw; background: #0f9d94; opacity: .35; }
.orb.o3 { width: 34vw; height: 34vw; left: 30vw; top: 42vh; background: #d94f92; opacity: .18; }

/* 顶部滚动进度条 */
.progress-bar {
  position: fixed; top: 0; left: 0; height: 2px; width: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3));
  z-index: 100; transition: width .1s linear;
}

/* ==========================================================================
   头部
   ========================================================================== */
.hero {
  max-width: 1180px;
  margin: 0 auto;
  padding: 74px 26px 26px;
}
.brand {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: 13px; letter-spacing: 2px; color: var(--text-2);
  padding: 7px 14px 7px 8px;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--pill);
  backdrop-filter: blur(10px);
}
.brand .mark {
  width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-3));
  color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 0;
}
.hero h1 {
  font-size: clamp(34px, 6vw, 62px);
  line-height: 1.15;
  letter-spacing: -1px;
  margin: 22px 0 14px;
  font-weight: 800;
}
.grad {
  background: linear-gradient(100deg, var(--accent) 0%, var(--accent-2) 48%, var(--accent-3) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.lead {
  font-size: 15.5px; color: var(--text-2); max-width: 620px; margin-bottom: 26px;
}
.lead code {
  font-family: Consolas, monospace; font-size: 13.5px;
  background: var(--pill); border: 1px solid var(--border);
  padding: 1px 7px; border-radius: 5px; color: var(--text);
}

/* 统计 */
.stats { display: flex; flex-wrap: wrap; gap: 12px; }
.stat {
  flex: 1 1 150px; min-width: 132px;
  padding: 14px 18px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--card);
  backdrop-filter: blur(12px);
}
.stat b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
.stat span { font-size: 12px; color: var(--text-3); letter-spacing: .5px; }

/* ==========================================================================
   工具栏（吸顶）
   ========================================================================== */
.toolbar-wrap {
  position: sticky; top: 0; z-index: 50;
  padding: 14px 26px;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(18px) saturate(140%);
  border-bottom: 1px solid var(--border);
  transition: background .35s ease;
}
.toolbar {
  max-width: 1128px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.search {
  position: relative; flex: 1 1 260px; max-width: 380px;
  display: flex; align-items: center;
}
.search svg { position: absolute; left: 13px; width: 16px; height: 16px; stroke: var(--text-3); fill: none; stroke-width: 2; }
.search input {
  width: 100%; padding: 10px 46px 10px 38px;
  border-radius: 11px; border: 1px solid var(--border);
  background: var(--card); color: var(--text);
  font-size: 13.5px; font-family: inherit;
  transition: border-color .2s, background .2s;
}
.search input::placeholder { color: var(--text-3); }
.search input:focus { outline: none; border-color: var(--accent); background: var(--bg-soft); }
.search kbd {
  position: absolute; right: 10px; font-size: 11px; font-family: Consolas, monospace;
  color: var(--text-3); border: 1px solid var(--border); border-radius: 5px;
  padding: 1px 6px; background: var(--pill);
}

.chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; flex: 1 1 auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; font-size: 12.5px; padding: 6px 13px; border-radius: 999px;
  border: 1px solid var(--border); background: transparent; color: var(--text-2);
  cursor: pointer; font-family: inherit; transition: all .18s;
  white-space: nowrap;
}
.chip:hover { color: var(--text); border-color: var(--border-strong); }
.chip.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-3));
  color: #fff; border-color: transparent;
  box-shadow: 0 6px 18px rgba(124, 108, 255, .36);
}
.icon-btn {
  width: 38px; height: 38px; flex-shrink: 0; border-radius: 11px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  cursor: pointer; font-size: 15px; display: grid; place-items: center;
  transition: all .18s;
}
.icon-btn:hover { border-color: var(--border-strong); transform: translateY(-1px); }

/* ==========================================================================
   主体
   ========================================================================== */
main { max-width: 1180px; margin: 0 auto; padding: 34px 26px 20px; }

.chapter { margin-bottom: 44px; }
.chapter-head {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
  padding-bottom: 12px; border-bottom: 1px solid var(--border);
}
.chapter-head .ico { font-size: 20px; }
.chapter-head h2 { font-size: 19px; font-weight: 700; letter-spacing: .5px; }
.chapter-head .badge {
  font-size: 11.5px; color: var(--text-3); border: 1px solid var(--border);
  border-radius: 999px; padding: 1px 9px;
}
.chapter-head .rule {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--border), transparent);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
  gap: 16px;
}

.card {
  position: relative;
  display: flex; flex-direction: column;
  padding: 18px 18px 16px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: var(--card);
  text-decoration: none; color: inherit;
  backdrop-filter: blur(12px);
  overflow: hidden;
  transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, background .25s, box-shadow .25s;
  opacity: 0; transform: translateY(14px);
}
.card.in { opacity: 1; transform: none; }
.card::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(420px circle at 50% -20%, rgba(124, 108, 255, .22), transparent 62%);
  opacity: 0; transition: opacity .3s;
}
.card:hover {
  transform: translateY(-5px);
  border-color: var(--border-strong);
  background: var(--card-hover);
  box-shadow: var(--shadow);
}
.card:hover::before { opacity: 1; }

.card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-top .icon {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  font-size: 19px;
  background: var(--pill); border: 1px solid var(--border);
  transition: transform .25s;
}
.card:hover .icon { transform: scale(1.08) rotate(-4deg); }
.card-top .num {
  font-family: Consolas, monospace; font-size: 11.5px; color: var(--text-3);
  border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px;
  letter-spacing: .5px;
}
.card h3 { font-size: 15.5px; font-weight: 700; line-height: 1.45; margin-bottom: 6px; }
.card p { font-size: 12.5px; color: var(--text-2); line-height: 1.65; flex: 1; }
.card-foot {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border);
}
.tag {
  font-size: 11px; letter-spacing: .3px; color: var(--accent-2);
  background: rgba(53, 214, 200, .12);
  border: 1px solid rgba(53, 214, 200, .25);
  padding: 2px 9px; border-radius: 999px;
}
html[data-theme="light"] .tag { color: #0b7a71; background: rgba(15,168,156,.1); border-color: rgba(15,168,156,.25); }
.arrow {
  font-size: 14px; color: var(--text-3);
  transition: transform .25s, color .25s;
}
.card:hover .arrow { transform: translateX(4px); color: var(--accent); }

/* 空状态 */
.empty {
  text-align: center; padding: 80px 20px; border: 1px dashed var(--border);
  border-radius: 18px; color: var(--text-3); font-size: 14px;
}
.empty .big { font-size: 34px; display: block; margin-bottom: 10px; }

/* 页脚 */
footer {
  max-width: 1180px; margin: 20px auto 0; padding: 30px 26px 46px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; flex-wrap: wrap;
  font-size: 12.5px; color: var(--text-3);
}
footer .tech { display: flex; gap: 7px; flex-wrap: wrap; }
footer .tech span {
  padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--pill); font-size: 11.5px; color: var(--text-2);
}
footer b { color: var(--text); }

/* 右下角模式提示 */
.mode-toast {
  position: fixed; right: 20px; bottom: 20px; z-index: 60;
  max-width: 300px; padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--bg-soft);
  box-shadow: var(--shadow); font-size: 12px; color: var(--text-2);
  opacity: 0; transform: translateY(10px); transition: all .3s;
}
.mode-toast.show { opacity: 1; transform: none; }
.mode-toast b { color: var(--text); }
.mode-toast code {
  font-family: Consolas, monospace; background: var(--pill);
  padding: 1px 5px; border-radius: 4px;
}

@media (max-width: 720px) {
  .hero { padding-top: 48px; }
  .toolbar { gap: 8px; }
  .search { max-width: none; flex-basis: 100%; }
  .stat { flex: 1 1 45%; }
  main { padding-top: 24px; }
}
</style>
</head>

  var meta = META[filename] || null;
  var name = filename.replace(/\.html$/i, '');
  var m = name.match(/^(\d+)-(\d+)\s*(.*)$/);

  var ch = 0, num = '', sub = '';
  if (m) {
    ch = parseInt(m[1], 10);
    num = m[1] + '-' + m[2];
    sub = m[3] || '';
  }

  // 详情页标题加后缀
  var title = meta ? meta[0]
            : (num ? (sub ? num + ' ' + sub : num + ' 课堂实践') : name);

  var desc = meta ? meta[1] : '课堂实践练习页面';
  var tag  = meta ? meta[2] : '课堂实践';

  return {
    file: filename,
    href: './' + encodeURIComponent(filename),
    ch: ch,
    num: num || '★',
    icon: (CHAPTERS[ch] || { icon: '📄' }).icon,
    title: title,
    desc: desc,
    tag: tag
  };
}

/* 排序：章节号 → 小节号 → 详情页排在本体之后 */
function sortKey(item) {
  var m = item.num.match(/^(\d+)-(\d+)/);
  var a = m ? parseInt(m[1], 10) : 999;
  var b = m ? parseInt(m[2], 10) : 999;
  var isDetail = /detail/i.test(item.file) ? 1 : 0;
  return [a, b, isDetail];
}
function compareItems(x, y) {
  var kx = sortKey(x), ky = sortKey(y);
  for (var i = 0; i < 3; i++) {
    if (kx[i] !== ky[i]) return kx[i] - ky[i];
  }
  return x.file.localeCompare(y.file);
}

/* ==========================================================================
   3. 状态与渲染
   ========================================================================== */
var ALL = [];            // 全部条目
var activeChapter = 'all';
var keyword = '';
var main = document.getElementById('main');
var chipsBox = document.getElementById('chips');
var searchInput = document.getElementById('searchInput');
var modeToast = document.getElementById('modeToast');
var observer = null;

/* 章节排序：综合项目（0）永远排在最后 */
function chOrder(ch) { return ch === 0 ? 999 : ch; }

function buildChips() {
  var chapters = [];
  var seen = {};
  ALL.forEach(function (it) {
    if (!seen[it.ch]) { seen[it.ch] = true; chapters.push(it.ch); }
  });
  chapters.sort(function (a, b) { return chOrder(a) - chOrder(b); });

  var html = '<button class="chip active" data-ch="all">全部 ' + ALL.length + '</button>';
  chapters.forEach(function (ch) {
    var c = CHAPTERS[ch] || { name: ch + ' 章', icon: '📄' };
    var count = ALL.filter(function (it) { return it.ch === ch; }).length;
    html += '<button class="chip" data-ch="' + ch + '">' + c.icon + ' ' + c.name + ' ' + count + '</button>';
  });
  chipsBox.innerHTML = html;
}

function render() {
  var kw = keyword.trim().toLowerCase();
  var list = ALL.filter(function (it) {
    var okCh = (activeChapter === 'all') || (it.ch === Number(activeChapter));
    var okKw = !kw || (it.title + it.desc + it.tag + it.file).toLowerCase().indexOf(kw) > -1;
    return okCh && okKw;
  });

  if (list.length === 0) {
    main.innerHTML = '<div class="empty"><span class="big">🔍</span>没有找到匹配的页面<br>换个关键字试试，或点「全部」查看所有内容</div>';
    return;
  }

  // 按章节分组
  var groups = {};
  list.forEach(function (it) { (groups[it.ch] = groups[it.ch] || []).push(it); });

  var html = '';
  Object.keys(groups).map(Number).sort(function (a, b) { return chOrder(a) - chOrder(b); }).forEach(function (ch) {
    var c = CHAPTERS[ch] || { name: '第 ' + ch + ' 章', icon: '📄' };
    var items = groups[ch];
    html += '<section class="chapter">' +
              '<div class="chapter-head">' +
                '<span class="ico">' + c.icon + '</span>' +
                '<h2>' + c.name + '</h2>' +
                '<span class="badge">' + items.length + ' 个页面</span>' +
                '<span class="rule"></span>' +
              '</div>' +
              '<div class="grid">';

    items.forEach(function (it) {
      html += '<a class="card" href="' + it.href + '">' +
                '<div class="card-top">' +
                  '<span class="icon">' + it.icon + '</span>' +
                  '<span class="num">' + it.num + '</span>' +
                '</div>' +
                '<h3>' + escapeHtml(it.title) + '</h3>' +
                '<p>' + escapeHtml(it.desc) + '</p>' +
                '<div class="card-foot">' +
                  '<span class="tag">' + escapeHtml(it.tag) + '</span>' +
                  '<span class="arrow">→</span>' +
                '</div>' +
              '</a>';
    });
    html += '</div></section>';
  });

  main.innerHTML = html;
  revealCards();
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* 滚动渐入 */
function revealCards() {
  var cards = main.querySelectorAll('.card');
  if (!('IntersectionObserver' in window)) {
    for (var i = 0; i < cards.length; i++) cards[i].classList.add('in');
    return;
  }
  if (observer) observer.disconnect();
  observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) {
        en.target.classList.add('in');
        observer.unobserve(en.target);
      }
    });
  }, { rootMargin: '0px 0px -40px 0px' });

  for (var j = 0; j < cards.length; j++) {
    cards[j].style.transitionDelay = (j % 6) * 40 + 'ms';
    observer.observe(cards[j]);
  }
}

/* ==========================================================================
   4. 统计
   ========================================================================== */
function updateStats() {
  var chapters = {};
  var tags = {};
  var jsCount = 0;
  ALL.forEach(function (it) {
    chapters[it.ch] = true;
    tags[it.tag] = true;
    if (it.ch >= 15) jsCount++;
  });
  document.getElementById('statPages').textContent = ALL.length;
  document.getElementById('statChapters').textContent = Object.keys(chapters).length;
  document.getElementById('statJs').textContent = jsCount;
  document.getElementById('statTags').textContent = Object.keys(tags).length;
  document.getElementById('leadCount').textContent = ALL.length;
}

/* ==========================================================================
   5. 事件
   ========================================================================== */
chipsBox.addEventListener('click', function (e) {
  var chip = e.target.closest('.chip');
  if (!chip) return;
  var all = chipsBox.querySelectorAll('.chip');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
  chip.classList.add('active');
  activeChapter = chip.getAttribute('data-ch');
  render();
});

var searchTimer = null;
searchInput.addEventListener('input', function () {
  clearTimeout(searchTimer);
  var v = this.value;
  searchTimer = setTimeout(function () {
    keyword = v;
    render();
  }, 120);
});

// "/" 聚焦搜索框，Esc 清空
document.addEventListener('keydown', function (e) {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape' && document.activeElement === searchInput) {
    searchInput.value = '';
    keyword = '';
    render();
    searchInput.blur();
  }
});

/* 主题切换 */
var themeBtn = document.getElementById('themeBtn');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = (t === 'dark') ? '🌙' : '☀️';
  try { localStorage.setItem('xzx-theme', t); } catch (e) {}
}
themeBtn.addEventListener('click', function () {
  var now = document.documentElement.getAttribute('data-theme');
  applyTheme(now === 'dark' ? 'light' : 'dark');
});
(function initTheme() {
  var saved = null;
  try { saved = localStorage.getItem('xzx-theme'); } catch (e) {}
  applyTheme(saved || 'dark');
})();

/* 滚动进度条 */
window.addEventListener('scroll', function () {
  var h = document.documentElement.scrollHeight - window.innerHeight;
  var p = h > 0 ? (window.scrollY / h) * 100 : 0;
  document.getElementById('progressBar').style.width = p + '%';
}, { passive: true });

/* ==========================================================================
   6. 加载（优先服务端扫描，失败用离线清单）
   ========================================================================== */
function start(names, online) {
  ALL = names.map(parseFile).sort(compareItems);
  buildChips();
  updateStats();
  render();

  if (online) {
    showToast('⚡ <b>自动同步模式</b>：目录中的 html 文件变化后页面会自动刷新。');
    startHotReload();
  } else {
    showToast('📋 <b>本地清单模式</b>（' + ALL.length + ' 页）。<br>想自动发现新文件？在该目录运行 <code>python serve.py</code> 后访问 <code>http://localhost:8000/</code>。');
  }
}

function showToast(html) {
  modeToast.innerHTML = html;
  setTimeout(function () { modeToast.classList.add('show'); }, 600);
  setTimeout(function () { modeToast.classList.remove('show'); }, 9000);
}

function loadFromServer() {
  return fetch('/files', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('no endpoint');
      return r.json();
    })
    .then(function (data) {
      return Object.keys(data).sort(function (a, b) {
        return (data[a] || 0) - (data[b] || 0);
      });
    });
}

var latestStamp = 0;
function startHotReload() {
  fetch('/check-update', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { latestStamp = d.latest || 0; })
    .catch(function () {});

  setInterval(function () {
    fetch('/check-update', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.latest && d.latest !== latestStamp) {
          latestStamp = d.latest;
          location.reload();
        }
      })
      .catch(function () {});
  }, 3000);
}

loadFromServer()
  .then(function (names) { start(names, true); })
  .catch(function () { start(FALLBACK, false); });
</script>
