<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1020 徐梓轩的《高级网页设计》课堂实践</title>
    <style>
        /* ========== 全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "SimHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #e0e0e0;
            line-height: 1.8;
        }

        /* ========== 头部区域 ========== */
        header {
            text-align: center;
            padding: 50px 20px 30px;
            background: linear-gradient(180deg, rgba(48, 43, 99, 0.9), transparent);
        }

        header h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5), 0 0 40px rgba(100, 200, 255, 0.2);
            margin-bottom: 10px;
        }

        header .subtitle {
            font-size: 16px;
            color: #a0a0d0;
            letter-spacing: 2px;
        }

        header .divider {
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #6c63ff, transparent);
            margin: 20px auto 0;
            border-radius: 2px;
        }

        /* ========== 主体内容 ========== */
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        /* ========== 链接卡片区域 ========== */
        .section-title {
            font-size: 22px;
            color: #b8b8ff;
            margin-bottom: 20px;
            padding-left: 14px;
            border-left: 4px solid #6c63ff;
            letter-spacing: 1px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px 20px;
            text-decoration: none;
            color: #e0e0e0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #6c63ff, #48c6ef);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(108, 99, 255, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.15);
        }

        .card:hover::before {
            transform: scaleX(1);
        }

        .card .card-icon {
            font-size: 32px;
            margin-bottom: 10px;
            display: inline-block;
        }

        .card .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
        }

        .card .card-desc {
            font-size: 13px;
            color: #999;
            line-height: 1.6;
        }

        .card .card-tag {
            display: inline-block;
            margin-top: 10px;
            padding: 2px 10px;
            font-size: 11px;
            border-radius: 20px;
            background: rgba(108, 99, 255, 0.2);
            color: #9d97ff;
            letter-spacing: 0.5px;
        }

        /* ========== 提示词区域 ========== */
        .prompt-section {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 28px 24px;
            margin-top: 10px;
        }

        .prompt-section .section-title {
            margin-bottom: 14px;
        }

        .prompt-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(108, 99, 255, 0.25);
            border-radius: 8px;
            padding: 20px;
            font-size: 14px;
            color: #c0c0e0;
            line-height: 1.9;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .prompt-box .label {
            color: #6c63ff;
            font-weight: 600;
        }

        /* ========== 页脚 ========== */
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #666;
            font-size: 13px;
            letter-spacing: 1px;
        }

        footer span {
            color: #6c63ff;
        }

        /* ========== 装饰动画 ========== */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .float-dot {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(108, 99, 255, 0.3);
            animation: float 4s ease-in-out infinite;
            pointer-events: none;
        }

        .float-dot:nth-child(1) { top: 15%; left: 8%; animation-delay: 0s; }
        .float-dot:nth-child(2) { top: 40%; left: 92%; animation-delay: 1s; width: 8px; height: 8px; }
        .float-dot:nth-child(3) { top: 70%; left: 5%; animation-delay: 2s; }
        .float-dot:nth-child(4) { top: 85%; left: 88%; animation-delay: 0.5s; width: 5px; height: 5px; }
        .float-dot:nth-child(5) { top: 25%; left: 95%; animation-delay: 1.5s; width: 4px; height: 4px; }
        .float-dot:nth-child(6) { top: 60%; left: 3%; animation-delay: 2.5s; width: 7px; height: 7px; }
    </style>
</head>
<body>

    <!-- 装饰浮动点 -->
    <div class="float-dot"></div>
    <div class="float-dot"></div>
    <div class="float-dot"></div>
    <div class="float-dot"></div>
    <div class="float-dot"></div>
    <div class="float-dot"></div>

    <!-- 头部 -->
    <header>
        <h1>&#x1F4BB; 徐梓轩的《高级网页设计》课堂实践</h1>
        <p class="subtitle">Advanced Web Design &mdash; Class Practice Portfolio</p>
        <div class="divider"></div>
    </header>

    <!-- 主体 -->
    <main>

        <!-- 页面导航链接（动态生成） -->
        <h2 class="section-title">&#x1F517; 课堂实践页面导航 <span id="fileCount" style="font-size:13px;color:#7f7fc0;margin-left:8px;"></span></h2>
        <div class="card-grid" id="cardGrid"></div>

        <!-- 提示词内容 -->
        <div class="prompt-section">
            <h2 class="section-title">&#x1F4CB; 本页面生成提示词</h2>
            <div class="prompt-box"><span class="label">提示词：</span>"更新首页，包括所有html文件"

<span class="label">自动更新：</span>已启用 — 每次目录中新增 / 修改 / 删除 html 文件，首页会自动刷新并重新生成卡片（需通过 serve.py 本地服务器访问）</div>
        </div>

    </main>

    <!-- 页脚 -->
    <footer>
        &copy; 2026 <span>徐梓轩</span> &mdash; 《高级网页设计》课堂实践 &mdash; All Rights Reserved
    </footer>

    <!-- 自动扫描目录、动态渲染卡片 + 热更新 -->
    <script>
    (function () {
        var GRID = document.getElementById('cardGrid');
        var COUNT = document.getElementById('fileCount');

        // 离线兜底：真实创建时间顺序（最旧 → 最新）
        var FALLBACK = [
            '2-1.html','2-2.html',
            '3-1 form.html','3-2 css.html',
            '4-1.html',
            '5-1.html','5-2.html',
            '6-1 flex.html','6-2.html',
            '7-1上图下文.html','7-2左图右文.html',
            '8-1css3.html','9-1.html',
            '10-1.html','10-2.html','10-3.html','10-4.html',
            '12-1.html','12-2.html',
            '15-1.html','15-2.html',
            '16-1.html','16-2.html','16-3.html','16-4.html',
            '三级项目.html'
        ];

        var ICONS = ['📐','🎨','💡','✨','📝','🔧','🚀','📊','🎯','⚡','🧩','🏗️','🌐','📚','🔥','💻','🛠️','🎪','🎭','🎬','📦','🔄'];

        // 文件名 → 标题/描述/标签
        function parseFile(filename) {
            var name = filename.replace(/\.html$/i, '');
            var numMatch = name.match(/^(\d+-\d+)\s*(.*)$/);
            var prefix = numMatch ? numMatch[1] : '';
            var suffix = numMatch ? (numMatch[2] || '') : name;

            var kwMap = [
                { re: /三级项目|闲鱼/i,        t: '三级项目 · 闲鱼首页', d: '闲鱼风格校园闲置互助平台首页：完整布局 + 分类/标签/搜索筛选', tag: '三级项目' },
                { re: /16-1/,                 t: 'JS 数组方法可视化',   d: 'map、filter、reduce、sort 等数组方法交互演示',              tag: 'JavaScript' },
                { re: /16-2/,                 t: 'JS 对象与字符串可视化', d: '对象操作与字符串方法交互演示',                              tag: 'JavaScript' },
                { re: /16-4/,                 t: 'Tab选项卡 · 排行榜',  d: '新浪排行榜 Tab 选项卡切换交互',                                tag: 'JavaScript' },
                { re: /16-3/,                 t: '商品分类导航',        d: '分类菜单与商品筛选联动',                                       tag: '综合练习' },
                { re: /form|表单/i,           t: '表单Form',           d: '文本输入、密码、单选、复选、下拉、文本域、日期、文件与按钮', tag: '表单' },
                { re: /css3/i,                t: 'CSS3新特性',         d: '圆角、阴影、渐变、过渡、变换、动画等视觉增强',              tag: 'CSS3' },
                { re: /动画|keyframes/i,       t: 'CSS3动画',           d: '@keyframes 关键帧动画、animation、transform',                tag: 'CSS3 动画' },
                { re: /javascript|js|程序|结构|条件|循环/i, t: 'JavaScript 程序结构', d: '条件结构（if/switch/三元）+ 循环结构（for/while/for...of）', tag: 'JavaScript' },
                { re: /flex/i,                t: 'Flex弹性布局',       d: 'display:flex、justify-content、align-items、flex-wrap',     tag: 'Flex 布局' },
                { re: /盒模型|box/i,           t: '盒模型',             d: 'content、padding、border、margin 的运用',                    tag: '盒模型' },
                { re: /层叠|继承|优先级/i,      t: '层叠与继承',         d: 'CSS 层叠性、继承性、选择器优先级',                            tag: 'CSS 优先级' },
                { re: /群组|后代|选择器/i,      t: 'CSS选择器',          d: '群组选择器、后代选择器的综合运用',                             tag: 'CSS 进阶' },
                { re: /css/i,                 t: 'CSS层叠样式表',      d: 'CSS选择器与样式属性',                                        tag: 'CSS 基础' },
                { re: /上图下文/i,             t: '上图下文布局',       d: '图片上方、文字下方的图文布局',                                 tag: '图文布局' },
                { re: /左图右文/i,             t: '左图右文布局',       d: '图片左侧、文字右侧的图文布局',                                 tag: '图文布局' },
                { re: /超链接|表格/i,           t: '超链接与表格',       d: '超链接、图片、相对路径与绝对路径',                             tag: 'HTML 进阶' },
                { re: /grid|网格/i,            t: 'Grid网格布局',       d: 'CSS Grid 二维网格布局系统',                                   tag: 'Grid 布局' },
                { re: /变量|variable/i,        t: 'CSS变量',           d: 'CSS 自定义属性与 var() 函数',                                tag: 'CSS 进阶' },
                { re: /数7|游戏|规则/i,         t: '数7游戏',           d: '7 的倍数或个位是 7 的空盒子游戏',                             tag: '趣味练习' },
                { re: /基础|元素/i,             t: 'HTML基础元素',       d: 'HTML 元素结构、列表与 DIV 布局',                              tag: 'HTML 基础' },
            ];

            var match = null;
            for (var i = 0; i < kwMap.length; i++) {
                if (suffix && kwMap[i].re.test(suffix)) { match = kwMap[i]; break; }
                if (!match && kwMap[i].re.test(name)) { match = kwMap[i]; }
            }

            var title, desc, tag;
            if (match) {
                title = prefix ? (prefix + ' ' + match.t) : match.t;
                desc  = match.d;
                tag   = match.tag;
            } else if (prefix && suffix) {
                title = prefix + ' ' + suffix; desc = '课堂实践练习'; tag = '课堂实践';
            } else if (prefix) {
                title = prefix + ' 课堂实践'; desc = '课堂实践练习'; tag = '课堂实践';
            } else {
                title = name || '未命名'; desc = '课堂实践练习'; tag = '课堂实践';
            }

            // 稳定图标
            var iconIdx = 0;
            if (prefix) {
                var parts = prefix.split('-');
                iconIdx = (parseInt(parts[0],10)*7 + parseInt(parts[1]||'0',10)*3) % ICONS.length;
            } else {
                for (var k=0; k<name.length; k++) iconIdx = (iconIdx + name.charCodeAt(k)) % ICONS.length;
            }

            return {
                filename: filename,
                href: './' + filename,
                icon: ICONS[iconIdx],
                title: title,
                desc: desc,
                tag: tag
            };
        }

        function render(list) {
            GRID.innerHTML = '';
            var html = '';
            list.forEach(function (item) {
                html +=
                    '<a class="card" href="' + item.href + '">' +
                    '<span class="card-icon">' + item.icon + '</span>' +
                    '<div class="card-title">' + item.title + '</div>' +
                    '<div class="card-desc">' + item.desc + '</div>' +
                    '<span class="card-tag">' + item.tag + '</span>' +
                    '</a>';
            });
            GRID.innerHTML = html;
            COUNT.textContent = '（共 ' + list.length + ' 页）';
        }

        var currentLatest = 0;

        function loadFromServer() {
            return fetch('/files', { cache: 'no-store' })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    // data = { filename: mtime }，按 mtime 升序（越旧越靠前）
                    return Object.keys(data).sort(function (a, b) {
                        return (data[a] || 0) - (data[b] || 0);
                    });
                });
        }

        function loadFromFallback() {
            // FALLBACK 已按真实创建时间排列，直接返回拷贝
            return new Promise(function (resolve) { resolve(FALLBACK.slice()); });
        }

        function load() {
            loadFromServer().then(function (names) {
                render(names.map(parseFile));
                startHotReload();
            }).catch(function () {
                loadFromFallback().then(function (names) {
                    render(names.map(parseFile));
                    showFallbackTip();
                });
            });
        }

        function showFallbackTip() {
            var tip = document.createElement('div');
            tip.style.cssText = 'grid-column:1/-1;text-align:center;padding:20px;background:rgba(255,255,255,0.04);border:1px dashed rgba(255,255,255,0.2);border-radius:10px;color:#a0a0c0;font-size:13px;';
            tip.innerHTML = '💡 当前为离线清单（' + FALLBACK.length + ' 个文件）。<br>想启用"自动发现 + 热更新"？请在 <code style="color:#b8b8ff;">d:\\VSCode</code> 下运行：<code style="color:#b8b8ff;">python serve.py</code>，然后访问 <code style="color:#b8b8ff;">http://localhost:8000/</code>';
            GRID.parentNode.insertBefore(tip, GRID.nextSibling);
        }

        function startHotReload() {
            fetch('/check-update', { cache: 'no-store' })
                .then(function (r) { return r.json(); })
                .then(function (d) { currentLatest = d.latest || 0; })
                .catch(function () {});

            setInterval(function () {
                fetch('/check-update', { cache: 'no-store' })
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        if (d.latest && d.latest !== currentLatest) {
                            currentLatest = d.latest;
                            location.reload();
                        }
                    })
                    .catch(function () {});
            }, 3000);
        }

        load();
    })();
    </script>

</body>
</html>
