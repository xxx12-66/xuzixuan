<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>徐梓轩 - CSS 幻灯片</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f2f2;
            font-family: sans-serif;
        }

        .slideshow {
            position: relative;
            width: min(800px, 92vw);
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #222;
        }

        .slideshow img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            animation: slide 9s infinite;
        }

        .slideshow img:nth-child(2) {
            animation-delay: 3s;
        }

        .slideshow img:nth-child(3) {
            animation-delay: 6s;
        }

        .caption {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            padding: 16px;
            background-color: rgba(0, 0, 0, 0.55);
            color: #fff;
            text-align: center;
            font-size: 24px;
        }

        @keyframes slide {
            0%, 100% { opacity: 0; }
            3%, 30% { opacity: 1; }
            33% { opacity: 0; }
        }
    </style>
</head>
<body>
    <main class="slideshow" aria-label="徐梓轩图片幻灯片">
        <img src="./img/1.jpg" alt="幻灯片图片 1">
        <img src="./img/2.jpg" alt="幻灯片图片 2">
        <img src="./img/3.jpg" alt="幻灯片图片 3">
        <div class="caption">徐梓轩</div>
    </main>
</body>
</html>
