<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品分类导航 · 16-3</title>
<style>
    /* 全局样式重置 —— 徐梓轩 xzx */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        background: #fff;
        color: #1a1a1a;
        font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    /* ========== 分类面板 ========== */
    .cate-panel {
        width: 512px;
        max-width: 100%;
        background: #f7f8fa;
        border-radius: 16px;
        padding: 22px 16px;
    }

    .cate-item {
        display: flex;
        align-items: center;
        height: 52px;
        padding: 0 30px;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
        color: #1f1f1f;
        transition: background .18s ease, color .18s ease;
        outline: none;
    }
    .cate-item:hover,
    .cate-item:focus-visible {
        background: #ffffff;
        color: #e1251b;
        box-shadow: 0 2px 10px rgba(0, 0, 0, .06);
    }
    .cate-item.active {
        background: #ffffff;
        color: #e1251b;
        box-shadow: 0 2px 10px rgba(0, 0, 0, .06);
    }

    /* 线性图标 */
    .cate-item .ico {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        margin-right: 20px;
        color: #2b2b2b;
        transition: color .18s ease;
    }
    .cate-item:hover .ico,
    .cate-item:focus-visible .ico,
    .cate-item.active .ico {
        color: #e1251b;
    }
    .ico svg { display: block; width: 100%; height: 100%; }

    /* 文字 + 斜杠分隔 */
    .cate-text {
        font-size: 20px;
        line-height: 1;
        letter-spacing: .3px;
        white-space: nowrap;
        display: flex;
        align-items: center;
    }
    .cate-text .sep {
        display: inline-block;
        margin: 0 15px;
        color: #1f1f1f;
        font-weight: 400;
        transition: color .18s ease;
    }
    .cate-item:hover .sep,
    .cate-item.active .sep { color: #e1251b; }

    /* ========== 小屏适配 ========== */
    @media (max-width: 560px) {
        .cate-panel { padding: 14px 12px; border-radius: 14px; }
        .cate-item { height: 48px; padding: 0 8px; }
        .cate-item .ico { margin-right: 12px; }
        .cate-text { font-size: 15px; }
        .cate-text .sep { margin: 0 7px; }
    }
</style>
</head>
<body>

    <!-- ========== 左侧商品分类导航（线性图标 + 斜杠分组） ========== -->
    <nav class="cate-panel" id="catePanel" aria-label="商品分类导航">

        <!-- 1. 家用电器 -->
        <a class="cate-item" href="#">
            <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3.6" y="3.8" width="16.8" height="16.4" rx="2.6"/>
                    <rect x="6.9" y="7" width="4.6" height="3.8" rx=".8"/>
                    <path d="M15.2 8.9h2.2"/>
                </svg>
            </span>
            <span class="cate-text">
                冰洗<span class="sep">/</span>空调<span class="sep">/</span>电视<span class="sep">/</span>厨卫大电
            </span>
        </a>

        <!-- 2. 电脑办公 -->

                    <rect x="3" y="4" width="18" height="12.5" rx="1.8"/>

                </svg>
            </span>

                电脑<span class="sep">/</span>办公<span class="sep">/</span>文具用品
            </span>

        <!-- 3. 手机数码 -->

                    <rect x="6.5" y="2.5" width="11" height="19" rx="2.4"/>

            <span class="cate-text">

                    <rect x="4" y="6.6" width="16" height="13" rx="3.2"/>
                    <path d="M4.9 10.6h14.2"/>
                    <path d="M9.4 6.6c0-1.2 1.2-2.2 2.6-2.2s2.6 1 2.6 2.2"/>

        <!-- 5. 食品酒类 -->
        <a class="cate-item" href="#">
            <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 8.2c-1.4-1.5-3.2-2.2-4.9-1.6C5.3 7.4 4 9.5 4 12c0 4.4 3.6 8 8 8s8-3.6 8-8c0-2.5-1.3-4.6-3.1-5.4-1.7-.6-3.5.1-4.9 1.6z"/>
                    <path d="M12 8.2V5.4"/>
                    <path d="M12 5.4c1.5 0 2.6-.9 2.9-2.1-1.5-.2-2.6.6-2.9 2.1z"/>
                </svg>
            </span>

        <!-- 6. 美妆个护 -->
        <a class="cate-item" href="#">

                    <path d="M15.9 7.2h0"/>

                    <rect x="5.4" y="7.2" width="6.4" height="13.6" rx="2.2"/>

            </span>
            <span class="cate-text">

        </a>

        <!-- 7. 元器件五金 -->
        <a class="cate-item" href="#">
            <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3.2l7.6 4.4v8.8L12 20.8 4.4 16.4V7.6z"/>
                    <circle cx="12" cy="12" r="3.6"/>
                </svg>
            </span>
            <span class="cate-text">
                元器件<span class="sep">/</span>劳保物资<span class="sep">/</span>五金机电
            </span>
        </a>

        <!-- 8. 家装建材 -->
        <a class="cate-item" href="#">
            <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4.6 8.6h14.8l-1.5 11.2a1.6 1.6 0 0 1-1.6 1.4H7.7a1.6 1.6 0 0 1-1.6-1.4z"/>
                    <path d="M8.6 8.6V7a3.4 3.4 0 0 1 6.8 0v1.6"/>
                </svg>
            </span>
            <span class="cate-text">
                家装<span class="sep">/</span>建材<span class="sep">/</span>家具
            </span>
        </a>

        <!-- 9. 家居日用 -->
        <a class="cate-item" href="#">
            <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3.6 10.4 12 3.4l8.4 7"/>
                    <path d="M5.6 9.6v9.6a1.4 1.4 0 0 0 1.4 1.4h10a1.4 1.4 0 0 0 1.4-1.4V9.6"/>
                </svg>
            </span>
            <span class="cate-text">
                家居日用<span class="sep">/</span>厨具
            </span>
        </a>

        <!-- 10. 男鞋运动 -->
        <a class="cate-item" href="#">
            <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3.4 17.2v-2.5c0-.7.5-1.3 1.2-1.4l3.1-.7 2.6-2.6c.3-.3.8-.4 1.2-.1l.8.5c.4.3.5.8.3 1.2l-.7 1.5 2.1 1 1.6-.9c.4-.2.9-.2 1.3.1l2 1.6c.4.3.6.8.6 1.3v1z"/>
                    <path d="M3.4 17.2h17.2"/>
                </svg>
            </span>
            <span class="cate-text">
                男鞋<span class="sep">/</span>运动<span class="sep">/</span>户外
            </span>

        <!-- 11. 男装女装 -->
        <a class="cate-item" href="#">
            <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8.6 4.2 5 6.4l-1.6 4.2 3.2 1.2v7.4h10.8v-7.4l3.2-1.2L19 6.4l-3.6-2.2a3.6 3.6 0 0 1-6.8 0z"/>
                </svg>
            </span>
            <span class="cate-text">
                男装<span class="sep">/</span>女装<span class="sep">/</span>童装<span class="sep">/</span>内衣
            </span>
        </a>

    </nav>

<script>
/* 点击某一分类时高亮（其余取消），仅作交互示意 */
document.getElementById('catePanel').addEventListener('click', function (e) {
    var item = e.target.closest('.cate-item');
    if (!item) return;
    e.preventDefault();
    var items = this.querySelectorAll('.cate-item');
    for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
    item.classList.add('active');
});
</script>
</body>
</html>
