<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型、框模型、box model</title>
    <style>
        body,u1,p,h1,h2,h3,h4,h5,h6{
            margin: 0;
            padding: 0;
        }
        ul{
            list-style: none;
        }
        .a{
            width: 500px;
            height: 500px;
            border: 2px dotted #039;
            padding: 70px 60px 50px 40px;
            margin: 40px auto;
        }
        .b{
            width: 500px;
            height: 300px;
            border: 2px dashed #039;
            margin: 40px auto 50px;
        }
        .c{
            width: 500px;
            height: 500px;
            border: 2px solid #039;
            margin: 40px auto;
        }
    </style>
</head>
<body>
    <div class="a">1020徐梓轩</div>
    <div class="b">1020徐梓轩</div>
    <div class="c">1020徐梓轩</div>
</body>
</html>
