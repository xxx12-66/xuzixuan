<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>1020徐梓轩</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .title{
            width: 500px;
            height: 33px;
            line-height: 33px;
            padding-left: 10px;
            margin: 50px;
        }
        .title h2{
            font-size: 14px;
            color: #039;
        }
        .title a{
            font-size: 12px;
            color: #999;
            text-decoration: none;
        }
        .title:first-child{
            border: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
        }
        .title:nth-child(2){
            display: flex;
            border-top: 1px solid #ccc;
        }
        .title:nth-child(2) h2{
            flex-grow: 1;
        }
        .title:nth-child(3){
            position: relative;
            border-bottom: 1px solid #039;
        }
        .title:nth-child(3) a{
            position: absolute;
            right: 16px;
            top: 0;
        }
    </style>
</head>
